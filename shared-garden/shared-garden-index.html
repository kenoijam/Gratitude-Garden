<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Supabase client, and the keys it reads.
       These two MUST stay inside <head>. They were briefly above <!DOCTYPE>,
       which is never valid: anything before the doctype makes the browser
       ignore it and render the whole page in QUIRKS MODE, which silently
       changes layout on every one of these pages. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="../config.js"></script>
  <!-- The ambient life: butterflies, a skein of birds and a few motes of light.
       One shared module for the hero and both gardens, drawn on a raw 2D
       context, which is why it can serve a p5 sketch and a plain canvas at
       once. It must load BEFORE any sketch draws. -->
  <script src="../garden-life.js"></script>

  <!-- One cursor for the whole project: a leaf at rest, a bloom over
       anything clickable. -->
  <script src="../garden-cursor.js"></script>

  <!-- One account across the whole project: the client, the session, the
       username and the friends list. Must load BEFORE the page modules,
       which borrow its client rather than making a second one. -->
  <script src="../garden-account.js"></script>

  <!-- The day by day log. Loaded after the account module, whose client it
       borrows for the parts that follow somebody between devices. -->
  <script src="../garden-journal.js"></script>
  <meta charset="UTF-8">
  <title>Gratitude Garden</title>
  <link rel="stylesheet" href="shared-garden-style.css" />

  <script src="shared-garden-p5.min.js"></script>
<script src="shared-garden-p5.dom.min.js"></script>

<script src="shared-garden-p5.party.js"></script>

<script src="shared-garden-sketch.js"></script>

</head>
<script>
if(/iPhone|iPad|iPod/.test(navigator.userAgent)){
  document.querySelector("[name=viewport]")
    .setAttribute("content","width=device-width, initial-scale=1, maximum-scale=1");
}
</script>
<body>
    <div id="ui-root"></div>
    <a href="../index.html" id="back-to-home" style="position:fixed;top:20px;left:14px;z-index:200;display:inline-flex;align-items:center;gap:6px;background:rgba(255,249,227,0.92);color:#1d6466;border:1.5px solid #b7e4e7;border-radius:50px;padding:7px 16px 7px 12px;font-family:Arial,Helvetica,sans-serif;font-size:13px;font-weight:700;text-decoration:none;box-shadow:0 2px 10px rgba(29,100,102,0.14);transition:background 0.2s,transform 0.15s;" onmouseover="this.style.background='#e1f7f7';this.style.transform='translateY(-1px)'" onmouseout="this.style.background='rgba(255,249,227,0.92)';this.style.transform='none'">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M9 2L4 7l5 5" stroke="#1d6466" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Home
    </a>


  <!-- Background music. Excited but soft: G major, four times the note density, climbing.
       One shared engine, synthesised live, no audio files. The mood is the
       only thing that differs per page. -->
  <!-- Likes and comments on a flower. Optional: with no Supabase project in
       config.js this does nothing at all and the garden is unchanged. -->
  <script src="shared-garden-social.js"></script>

  <script src="../garden-music.js" data-mood="bright"></script>
</body>

</html>
